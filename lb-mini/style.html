<style>
  [data-id='lb-mini'] {
    --border-r: 8px;
    --border-r-2: 4px;

    --height-header: 56px;
    --height-footer: 40px;
    --pad-lr: 16px;

    --darkness: {{getglobalvar::toggle_lb-mini.darkness}};
    --theme:
      {{#if_pure {{? {{getglobalvar::toggle_lb-mini.theme}}=0 }} }}'♦️'{{/if}}
      {{#if_pure {{? {{getglobalvar::toggle_lb-mini.theme}}=1 }} }}'💎'{{/if}}
      {{#if_pure {{? {{getglobalvar::toggle_lb-mini.theme}}=2 }} }}'✨'{{/if}}
      {{#if_pure {{? {{getglobalvar::toggle_lb-mini.theme}}=3 }} }}'🌳'{{/if}};
    --icon: var(--theme);
  }

  [data-id='lb-mini'] > * {
    --accent: #ff005e;
    --bg: #fff;
    --bg-2: #f9f9f9;
    --border: #e0e0e0;
    --fg: #282a35;
    --fg-2: #767b82;
  }

  @container style(--theme: '♦️') and style(--darkness: 0) {
    [data-id='lb-mini'] > * {
      --accent: #ff005e;
      --bg: #fff;
      --bg-2: #f9f9f9;
      --border: #e0e0e0;
      --fg: #282a35;
      --fg-2: #767b82;
    }
  }

  @container style(--theme: '♦️') and style(--darkness: 1) {
    [data-id='lb-mini'] > * {
      --accent: #ff6b9d;
      --bg: #1e1f23;
      --bg-2: #26282d;
      --border: #33363e;
      --fg: #f0f1f3;
      --fg-2: #8b8e96;
    }
  }

  @container style(--theme: '💎') and style(--darkness: 0) {
    [data-id='lb-mini'] > * {
      --accent: #007bff;
      --bg: #fff;
      --bg-2: #f9f9f9;
      --border: #e0e0e0;
      --fg: #282a35;
      --fg-2: #767b82;
    }
  }

  @container style(--theme: '💎') and style(--darkness: 1) {
    [data-id='lb-mini'] > * {
      --accent: #4299e1;
      --bg: #1e1f23;
      --bg-2: #26282d;
      --border: #33363e;
      --fg: #f0f1f3;
      --fg-2: #8b8e96;
    }
  }

  @container style(--theme: '✨') and style(--darkness: 0) {
    [data-id='lb-mini'] > * {
      --accent: #d4af37;
      --bg: #fff;
      --bg-2: #f9f9f9;
      --border: #e0e0e0;
      --fg: #282a35;
      --fg-2: #767b82;
    }
  }

  @container style(--theme: '✨') and style(--darkness: 1) {
    [data-id='lb-mini'] > * {
      --accent: #ecc94b;
      --bg: #1e1f23;
      --bg-2: #26282d;
      --border: #33363e;
      --fg: #f0f1f3;
      --fg-2: #8b8e96;
    }
  }

  @container style(--theme: '🌳') and style(--darkness: 0) {
    [data-id='lb-mini'] > * {
      --accent: #2e7d32;
      --bg: #fff;
      --bg-2: #f9f9f9;
      --border: #e0e0e0;
      --fg: #282a35;
      --fg-2: #767b82;
    }
  }

  @container style(--theme: '🌳') and style(--darkness: 1) {
    [data-id='lb-mini'] > * {
      --accent: #66bb6a;
      --bg: #1e1f23;
      --bg-2: #26282d;
      --border: #33363e;
      --fg: #f0f1f3;
      --fg-2: #8b8e96;
    }
  }
  /* #region shared */

  .lb-mini-rowgap {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .lb-mini-author {
    color: var(--fg);
    font-weight: 500;
  }

  .lb-mini-votes {
    align-items: center;
    color: var(--fg-2);
    display: inline-flex;
    gap: 6px;
  }

  .lb-mini-comment-count {
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .lb-mini-btn {
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--border-r-2);
    color: var(--fg);
    cursor: pointer;
    display: inline-flex;
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 500;
    gap: 4px;
    height: 28px;
    line-height: normal;
    padding: 0 10px;
    user-select: none;
  }

  .lb-mini-btn > svg {
    height: 1em;
    width: 1em;
  }

  .lb-mini-btn-icon {
    height: 28px;
    justify-content: center;
    padding: 0;
    width: 28px;
  }

  .lb-mini-subtle-btn {
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--border-r-2);
    color: var(--fg);
    cursor: pointer;
    display: inline-flex;
    font-size: 11px;
    font-weight: 500;
    gap: 4px;
    height: 24px;
    padding: 0 8px;
    user-select: none;
  }

  .lb-mini-subtle-btn > svg {
    height: 12px;
    width: 12px;
  }

  .lb-mini-icon-btn {
    background: transparent;
    border-radius: var(--border-r-2);
    color: var(--fg-2);
    cursor: pointer;
    padding: 4px;
  }
  .lb-mini-icon-btn > svg {
    display: block;
    height: 1em;
    width: 1em;
  }

  .lb-mini-meta {
    align-items: center;
    color: var(--fg-2);
    display: flex;
    flex-wrap: wrap;
    font-size: 12px;
    gap: 8px;
  }

  /* #endregion shared */

  .lb-mini-dialog:popover-open {
    background-color: var(--bg);
    border-radius: var(--border-r);
    border: 0;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.25);
    color: var(--fg);
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow: hidden;
  }

  .lb-mini-wrap {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    max-height: 100%;
    margin-top: auto;
    overflow-y: auto;
    padding: 0;
    position: relative;
    width: 100%;
  }

  .lb-mini-container {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    padding: 0;
  }

  .lb-mini-footer {
    align-items: center;
    background: var(--bg);
    border-top: 1px solid var(--border);
    box-sizing: border-box;
    display: flex;
    padding: 8px var(--pad-lr);
  }

  .lb-mini-close {
    align-items: center;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--border-r-2);
    box-sizing: border-box;
    color: var(--fg);
    cursor: pointer;
    display: flex;
    font-size: 13px;
    font-weight: 600;
    height: 38px;
    justify-content: center;
    width: 100%;
  }

  .lb-mini-header {
    align-items: center;
    background: var(--bg);
    border-bottom: 2px solid var(--accent);
    box-sizing: border-box;
    display: flex;
    gap: 8px;
    height: var(--height-header);
    padding: 0 var(--pad-lr);
  }

  .lb-mini-header > b {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lb-mini-header > b::before {
    content: var(--icon);
    margin-right: 4px;
  }

  .lb-mini-post {
    all: initial;
    border-bottom: 1px solid var(--border);
    color: var(--fg);
    display: block;
    font-family: inherit;
  }

  .lb-mini-post:last-child {
    border-bottom: none;
  }

  .lb-mini-post[open] {
    position: relative;
  }

  .lb-mini-post[open]::before {
    background: var(--accent);
    bottom: 0;
    content: '';
    left: 0;
    pointer-events: none;
    position: absolute;
    top: 0;
    width: 3px;
    z-index: 1;
  }

  .lb-mini-post::details-content {
    opacity: 0;
    transform: translateY(-5px);
    transition: opacity 0.2s ease-out, transform 0.2s ease-out, content-visibility 1ms allow-discrete;
  }
  .lb-mini-post[open]::details-content {
    opacity: 1;
    transform: none;
  }

  .lb-mini-post-summary {
    align-items: flex-start;
    all: initial;
    box-sizing: border-box;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 5px;
    list-style: none;
    padding: 12px var(--pad-lr);
    user-select: none;
    width: 100%;
  }

  .lb-mini-post-summary::-webkit-details-marker {
    display: none;
  }

  .lb-mini-post-summary:focus {
    outline: none;
  }

  .lb-mini-post[open] > .lb-mini-post-summary {
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
  }

  .lb-mini-post-title-row {
    align-items: baseline;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .lb-mini-post-title-text {
    color: var(--fg);
    font-size: 14px;
    font-weight: 400;
    line-height: 1.4;
  }

  .lb-mini-post-content {
    background: var(--bg);
    box-sizing: border-box;
    color: var(--fg);
    overflow: hidden;
    padding: 14px var(--pad-lr) 0;
    word-break: keep-all;
  }

  .lb-mini-post-content > p {
    font-size: 14px;
    color: inherit !important;
    line-height: 1.65;
    margin: 0 !important;
    white-space: pre-wrap;
  }

  .lb-mini-comments {
    background: var(--bg-2);
    border-top: 1px solid var(--border);
    margin: 14px calc(var(--pad-lr) * -1) 0;
    padding: 14px var(--pad-lr) 16px;
  }

  .lb-mini-comments-header {
    align-items: center;
    display: flex;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .lb-mini-comments-actions {
    display: flex;
    gap: 6px;
  }

  .lb-mini-comments-heading {
    color: var(--fg);
    font-size: 12px;
    font-weight: 700;
    margin: 0;
  }

  .lb-mini-timeline {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .lb-mini-comment {
    all: initial;
    box-sizing: border-box;
    color: var(--fg);
    display: flex;
    flex-direction: column;
    font-family: inherit;
    gap: 4px;
    padding-left: 16px;
    position: relative;
  }

  .lb-mini-comment::before {
    background: var(--accent);
    border-radius: 50%;
    content: '';
    height: 5px;
    left: 0;
    position: absolute;
    top: 6px;
    width: 5px;
    z-index: 1;
  }

  .lb-mini-comment:not(:last-child)::after {
    background: color-mix(in srgb, var(--accent) 70%, var(--border));
    content: '';
    left: 2px;
    position: absolute;
    top: 11px;
    bottom: -20px;
    width: 1px;
  }

  .lb-mini-delete-comment {
    background: transparent;
    border: 0;
    color: var(--fg-2);
    cursor: pointer;
    display: inline-flex;
    margin-left: auto;
    padding: 2px;
  }

  .lb-mini-delete-comment:hover {
    color: #dc3545;
  }

  .lb-mini-delete-comment > svg {
    display: block;
    height: 12px;
    width: 12px;
  }

  .lb-mini-comment-content {
    color: var(--fg) !important;
    font-size: 13px;
    line-height: 1.5;
    margin: 0 !important;
    white-space: pre-wrap;
  }

  .lb-mini-con-content {
    display: flex;
  }

  .lb-mini-con {
    background-position: center;
    background-repeat: no-repeat;
    background-size: contain;
    display: block;
    flex-shrink: 0;
    height: 100px;
    margin: 0;
    width: 100px;
  }

  @media (hover: hover) {
    .lb-mini-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }

    .lb-mini-subtle-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .lb-mini-icon-btn:hover {
      color: var(--accent);
    }

    .lb-mini-close:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .lb-mini-post:not([open]) .lb-mini-post-summary:hover {
      background: var(--bg-2);
    }
  }

  @media (max-width: 600px) {
    [data-id='lb-mini'] {
      --pad-lr: 12px;
    }

    .lb-mini-dialog:popover-open {
      border-radius: 0;
    }

    .lb-mini-post::details-content {
      transition: none;
    }

    .lb-mini-post-summary {
      padding: 10px 12px;
    }
  }
</style>
