<style>
  @import url('https://fonts.googleapis.com/css2?family=Asta+Sans:wght@300..800&family=Gloock&family=Inter:opsz,wght@14..32,100..900&family=Kalnia:wght@100..700&display=swap');

  @font-face {
    font-family: 'HsBombaram21';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2302@1.0/HSBombaram21-Regular.woff2') format('woff2');
    font-weight: normal;
    font-display: swap;
  }

  @font-face {
      font-family: 'PyeongchangPeace';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2206-02@1.0/PyeongChangPeace-Bold.woff2') format('woff2');
      font-weight: 700;
      font-display: swap;
  }

  [data-id='lb-xnai'],
  .lb-xnai-placeholder-wrapper,
  .lb-xnai-kv-wrapper,
  .lb-xnai-inlay-wrapper {
    --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
    --darkness: {{getglobalvar::toggle_lb-xnai.darkness}};
    clear: left;
  }

  @container style(--darkness: 0) {
    :is(
      [data-id='lb-xnai'],
      .x-risu-lb-xnai-placeholder-wrapper,
      .x-risu-lb-xnai-kv-wrapper,
      .x-risu-lb-xnai-inlay-wrapper) > * {
      --bg: #fff;
      --border: #3c3930;
      --fg: #3d3a32;
      --fg-2: #8b8578;
      --accent: #c9a227;
      --icon: '✦ ';
    }
  }

  @container style(--darkness: 1) {
    :is(
      [data-id='lb-xnai'],
      .x-risu-lb-xnai-placeholder-wrapper,
      .x-risu-lb-xnai-kv-wrapper,
      .x-risu-lb-xnai-inlay-wrapper) > * {
      --bg: #1e1d1a;
      --border: #3c3930;
      --fg: #f0e6d2;
      --fg-2: #c5b896;
      --accent: #d4a373;
      --icon: '✦ ';
    }
  }

  .lb-xnai-placeholder-wrapper {
    align-items: center;
    display: flex;
    gap: 0.3em;
    margin: 1em 0;
    position: relative;
  }

  .lb-xnai-placeholder-state,
  .lb-xnai-all-state,
  .lb-xnai-img-state {
    opacity: 0;
    pointer-events: none;
    position: absolute;
  }

  .lb-xnai-placeholder-wrapper .lb-xnai-toolbar-btn {
    border: 1px dashed oklch(from var(--accent) l c h / 0.5);
    border-radius: 0.4em;
    height: 3em;
    width: 3em;
  }

  .lb-xnai-placeholder {
    align-items: center;
    appearance: none;
    background: transparent;
    border: 1px dashed oklch(from var(--accent) l c h / 0.5);
    border-radius: 0.4em;
    color: var(--fg-2);
    cursor: pointer;
    display: inline-flex;
    height: 3em;
    font-size: 0.85em;
    justify-content: center;
    padding: 0.4em 0.7em;
    transition: border-color 0.15s ease, color 0.15s ease;
  }

  .lb-xnai-placeholder:hover {
    border: 1px dashed oklch(from var(--accent) calc(l + 0.2) c h / 0.5);
    color: var(--fg);
  }

  .lb-xnai-placeholder-state:focus-visible + .lb-xnai-placeholder {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .lb-xnai-placeholder-state:checked + .lb-xnai-placeholder {
    cursor: wait;
    pointer-events: none;
  }

  .lb-xnai-placeholder-loading {
    align-items: center;
    display: none;
    gap: 0.5em;
  }

  .lb-xnai-placeholder-state:checked + .lb-xnai-placeholder .lb-xnai-placeholder-idle {
    display: none;
  }

  .lb-xnai-placeholder-state:checked + .lb-xnai-placeholder .lb-xnai-placeholder-loading {
    display: inline-flex;
  }

  .lb-xnai-placeholder-spinner {
    animation: lb-xnai-placeholder-spin 0.8s linear infinite;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    box-sizing: border-box;
    display: inline-block;
    height: 1em;
    width: 1em;
  }

  @keyframes lb-xnai-placeholder-spin {
    to {
      transform: rotate(360deg);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .lb-xnai-placeholder-spinner {
      animation: none;
    }
  }

  .lb-xnai-kv-wrapper {
    background-color: #000;
    border-radius: 0.5em;
    container-type: inline-size;
    margin: {{#when::toggle::lb-xnai.kv.align}}1rem auto 1rem 0{{:else}}1rem auto{{/when}};
    {{#when {{and::{{? {{length::{{trim::{{getglobalvar::toggle_lb-xnai.kv.width}} }} }} > 0 }}::{{? {{getglobalvar::toggle_lb-xnai.kv.width}} != null }}}}}}
      max-width: min(100%, {{getglobalvar::toggle_lb-xnai.kv.width}}px);
    {{:else}}
      max-width: min(100%, 1200px);
    {{/when}}
    overflow: hidden;
    position: relative;
    transition: background-color 0.5s var(--ease-out-quart);
    width: 100%;
  }

  .lb-xnai-kv {
    aspect-ratio: {{dictelement::{"0": "3/1", "1": "2.35/1", "2": "16/9", "3": "1/1", "4": "2/3", "5": "auto"}::{{getglobalvar::toggle_lb-xnai.kv.ar}}}};
    background: #000;
    border: none;
    border-radius: 0.5em;
    box-sizing: content-box;
    cursor: pointer;
    display: block;
    margin: 0 auto;
    {{#when {{and::{{? {{length::{{trim::{{getglobalvar::toggle_lb-xnai.kv.width}} }} }} > 0 }}::{{? {{getglobalvar::toggle_lb-xnai.kv.width}} != null }}}}}}
      max-width: min(100cqw, {{getglobalvar::toggle_lb-xnai.kv.width}}px);
    {{:else}}
      max-width: min(100cqw, 1200px);
    {{/}}
    overflow: hidden;
    padding: 3.5cqw 0;
    position: relative;
    transition: max-width 0.5s var(--ease-out-quart), aspect-ratio 0.5s var(--ease-out-quart);
  }

  .lb-xnai-kv > img {
    border-radius: 0 !important;
    height: auto !important;
    margin: 0 auto !important;
    object-fit: cover !important;
    object-position: center 10% !important;
    width: 100% !important;
    max-height: 100% !important;
  }

  .lb-xnai-inlay-wraper {
    container-type: inline-size;
  }

  .lb-xnai-inlay {
    aspect-ratio: {{dictelement::{"0": "3/1", "1": "2.35/1", "2": "16/9", "3": "1/1", "4": "2/3", "5": "auto"}::{{getglobalvar::toggle_lb-xnai.scene.ar}}}};
    border: 1px solid var(--border);
    border-radius: 0.5em;
    margin: {{#when::toggle::lb-xnai.scene.align}}1rem auto 1rem 0{{:else}}1rem auto{{/when}};
    {{#when {{and::{{? {{length::{{trim::{{getglobalvar::toggle_lb-xnai.scene.width}} }} }} > 0 }}::{{? {{getglobalvar::toggle_lb-xnai.scene.width}} != null }}}}}}
      max-width: {{getglobalvar::toggle_lb-xnai.scene.width}}px;
    {{:else}}
      max-width: 600px;
    {{/}}
    overflow: hidden;
    position: relative;
  }

  .lb-xnai-inlay img:not(.x-risu-lb-xnai-fullsize-pop img) {
    aspect-ratio: {{dictelement::{"0": "3/1", "1": "2.35/1", "2": "16/9", "3": "1/1", "4": "2/3", "5": "auto"}::{{getglobalvar::toggle_lb-xnai.scene.ar}}}} !important;
    border-radius: 0.4em !important;
    display: block !important;
    height: auto !important;
    margin: 0 auto !important;
    object-fit: cover !important;
    object-position: center !important;
    width: 100% !important;
  }

  .lb-xnai-inlay > button {
    appearance: none;
    background: transparent;
    border: none;
    cursor: pointer;
    display: block;
    padding: 0;
    width: 100%;
  }

  .lb-xnai-fullsize-pop {
    align-items: center;
    backdrop-filter: blur(12px) saturate(1.1);
    background:
      radial-gradient(farthest-corner at 0% 0% in oklch, rgb(from var(--accent) r g b / 0.25) 0%, transparent 65%),
      linear-gradient(125deg in oklch, transparent 30%, rgb(from var(--accent) r g b / 0.1) 45%, transparent 60%),
      radial-gradient(ellipse at 100% 100% in oklch, rgb(from var(--accent) r g b / 0.15) 0%, transparent 55%),
      radial-gradient(circle at 50% 50% in oklch, transparent 25%, rgb(0 0 0 / 0.5) 120%),
      rgb(10 10 10 / 0.8);
    background-blend-mode: hard-light;
    border: none;
    height: 100%;
    justify-content: center;
    margin: auto;
    max-height: none;
    max-width: none;
    overflow: visible;
    padding: 0;
    position: relative;
    width: 100%;
  }
  .lb-xnai-fullsize-pop:popover-open {
    display: flex;
  }

  .lb-xnai-fullsize-pop-body {
    align-items: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }
  :popover-open .lb-xnai-fullsize-pop-body {
    animation: lb-slidein 0.2s ease forwards;
  }

  .lb-xnai-fullsize-pop-body > button {
    border: 1px solid var(--border);
    border-radius: 0.5em;
  }
  .lb-xnai-fullsize-pop-body img {
    border-radius: 0.5em !important;
    height: auto !important;
    margin: 0 !important;
    max-height: calc(100svh - 8rem) !important;
    max-width: 90vw !important;
    object-fit: contain !important;
    pointer-events: auto !important;
    width: auto !important;
  }

  .lb-xnai-fullsize-prompt-wrapper {
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    position: absolute;
  }
  .lb-xnai-fullsize-prompt-wrapper > input {
    display: none;
  }

  .lb-xnai-fullsize-prompt {
    background: var(--bg);
    border-radius: 0 0 0.5em 0.5em;
    inset: 0;
    margin: 0;
    max-height: 100%;
    opacity: 0;
    overflow: auto;
    pointer-events: auto;
    position: absolute;
    top: auto;
    transform: translateY(3em);
    transition: opacity 0.2s var(--ease-out-quart), transform 0.2s var(--ease-out-quart);
    visibility: hidden;
    white-space: pre-wrap;
  }
  :checked ~ .lb-xnai-fullsize-prompt {
    opacity: 1;
    transform: translateY(0);
    visibility: visible;
  }

  .lb-xnai-fullsize-actions {
    background: rgb(0 0 0 / 0.7);
    border-radius: 0.5em;
    display: flex;
    gap: 0.5em;
    justify-content: center;
    margin-top: 1rem;
    pointer-events: auto;
    position: absolute;
    top: 100%;
  }

  .lb-xnai-inlay-actions {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 0.5em 0 0 0.5em;
    display: flex;
    flex-direction: column;
    gap: 0.3em;
    opacity: 0;
    padding: 0.3em;
    position: absolute;
    right: -1px;
    top: 0.5em;
    transition: opacity 0.2s ease;
    z-index: 2;
  }

  .lb-xnai-kv-actions {
    top: 0;
    opacity: 0;
    padding: 0.3em;
    position: absolute;
    right: 0;
    transition: opacity 0.2s ease;
    z-index: 2;
  }

  @media (hover: hover) {
    .lb-xnai-inlay:hover .lb-xnai-inlay-actions {
      opacity: 1;
    }
    .lb-xnai-kv-wrapper:hover .lb-xnai-kv-actions {
      opacity: 1;
    }
  }

  .lb-xnai-toolbar-btn {
    align-items: center;
    appearance: none;
    background: transparent;
    border: none;
    color: var(--fg-2);
    cursor: pointer;
    display: flex;
    font-size: 0.85em;
    justify-content: center;
    padding: 0.4em 0.6em;
    transition: color 0.15s ease;
  }
  .lb-xnai-toolbar-btn:hover {
    color: var(--accent);
  }

  .lb-xnai-fullsize-actions .lb-xnai-toolbar-btn {
    font-size: 1em;
    height: 2.857em;
    width: 2.857em;
  }

  .lb-xnai-prompt-current b {
    color: var(--FontColorQuote2);
    font-family: inherit;
  }

  .lb-xnai-menu:popover-open {
    animation: lb-slidein 0.15s ease forwards;
    background: var(--bg);
    border: 1px dashed var(--accent);
    border-radius: 0.4em;
    color: var(--accent);
    display: flex;
    flex-direction: column;
    font-size: 0.8em;
    margin-bottom: 0.5em;
    padding: 0.5em 1em;
    position-area: top span-right;
    position-try: flip-block;
    transform-origin: bottom center;
  }

  .lb-xnai-menu > :is(button, label) {
    align-items: center;
    color: inherit;
    cursor: pointer;
    display: flex;
    gap: 0.5em;
    padding: 0.5em 0;
    font-size: 1em;
    text-align: left;
    transition:
      color 0.15s cubic-bezier(0.25, 1, 0.5, 1);
  }
  .lb-xnai-menu > :is(button, label):hover {
    color: var(--fg);
  }
  .lb-xnai-menu > :is(button, label) > svg {
    height: 1em;
    width: 1em;
  }

  .lb-xnai-loading-overlay {
    align-items: center;
    backdrop-filter: blur(2px);
    background: oklch(from var(--bg, #000) l c h / 0.55);
    border-radius: inherit;
    box-sizing: border-box;
    color: var(--accent);
    cursor: wait;
    display: none;
    font-size: 0.85em;
    font-weight: 600;
    gap: 0.6em;
    inset: 2px;
    justify-content: center;
    pointer-events: all;
    position: absolute;
    z-index: 3;
  }

  @layer lb-xnai-all {
    /* 1. Hide menus during generation */
    .chattext:has(.x-risu-lb-xnai-all-state:checked) .x-risu-lb-xnai-menu {
      display: none !important;
    }

    /* 2. Block all other operations in message during whole generation */
    .chattext:has(.x-risu-lb-xnai-all-state:checked) :is(.x-risu-lb-xnai-inlay-actions, .x-risu-lb-xnai-kv-actions) {
      display: none !important;
    }

    .chattext:has(.x-risu-lb-xnai-all-state:checked) :is(.x-risu-lb-xnai-inlay > button, .x-risu-lb-xnai-kv) {
      cursor: wait !important;
      pointer-events: none !important;
    }

    /* 3. Empty placeholders: whole generation vs individual */
    .chattext:has(.x-risu-lb-xnai-all-state:checked) .x-risu-lb-xnai-placeholder {
      cursor: wait;
      pointer-events: none;
    }
    .chattext:has(.x-risu-lb-xnai-all-state:checked) .x-risu-lb-xnai-placeholder .x-risu-lb-xnai-placeholder-idle {
      display: none !important;
    }
    .chattext:has(.x-risu-lb-xnai-all-state:checked) .x-risu-lb-xnai-placeholder .x-risu-lb-xnai-placeholder-loading {
      display: inline-flex !important;
    }

    /* 4. Show loading overlay */
    .chattext:has(.x-risu-lb-xnai-all-state:checked) :is(.x-risu-lb-xnai-inlay, .x-risu-lb-xnai-kv) .x-risu-lb-xnai-loading-overlay,
    .x-risu-lb-xnai-inlay:has(.x-risu-lb-xnai-img-state:checked) .x-risu-lb-xnai-loading-overlay,
    .x-risu-lb-xnai-kv-wrapper:has(.x-risu-lb-xnai-img-state:checked) .x-risu-lb-xnai-loading-overlay {
      display: flex !important;
    }

    /* 5. Close lightbox on individual regeneration */
    .x-risu-lb-xnai-inlay:has(.x-risu-lb-xnai-img-state:checked) .x-risu-lb-xnai-fullsize-pop,
    .x-risu-lb-xnai-kv-wrapper:has(.x-risu-lb-xnai-img-state:checked) .x-risu-lb-xnai-fullsize-pop {
      display: none !important;
    }
  }
</style>
